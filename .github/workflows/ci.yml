name: Estud CI (Typecheck & Quality Checks)

on:
  push:
    branches: ["main", "master", "feat/*", "fix/*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify:
    name: Typecheck & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js & Turbo Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "bun"

      - name: Install Monorepo Dependencies
        run: bun install --frozen-lockfile

      - name: Run Full TypeScript Verification
        run: bun run typecheck

      - name: Verify Web Production Build
        run: bun run --filter @estud/web build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/estud' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'dev_secret_for_ci_build_verification_32chars' }}
          NEXT_PUBLIC_APP_URL: "https://estud.et"
